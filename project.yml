name: LumenCam
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "17.0"
targets:
  LumenCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.lumencam
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
